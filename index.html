// PREMIUM HERO SLIDER WITH STYLISH TRANSITIONS
// ==========================================================================

function initHeroSlider() {
    const slides = document.querySelectorAll('.slide');
    if (!slides || slides.length === 0) {
        console.warn('No slides found');
        return;
    }
    
    let currentIndex = 0;
    const totalSlides = slides.length;
    let slideInterval;
    let isTransitioning = false;
    
    // Setup initial state
    slides.forEach((slide, index) => {
        slide.classList.remove('active', 'exit');
        if (index === 0) {
            slide.classList.add('active');
            const bgImage = slide.getAttribute('data-bg') || slide.style.backgroundImage;
            if (bgImage) {
                slide.style.backgroundImage = bgImage;
            }
        }
    });
    
    function changeSlide(index) {
        if (isTransitioning || index === currentIndex) return;
        isTransitioning = true;
        
        const currentSlide = slides[currentIndex];
        const nextSlide = slides[index];
        
        if (!currentSlide || !nextSlide) {
            isTransitioning = false;
            return;
        }
        
        // Set background for next slide
        const bgImage = nextSlide.getAttribute('data-bg') || nextSlide.style.backgroundImage;
        if (bgImage) {
            nextSlide.style.backgroundImage = bgImage;
        }
        
        // Animate current slide out
        currentSlide.classList.remove('active');
        currentSlide.classList.add('exit');
        
        // Animate next slide in
        nextSlide.classList.add('active');
        nextSlide.classList.remove('exit');
        
        // Clean up after transition
        setTimeout(() => {
            slides.forEach(s => s.classList.remove('exit'));
            isTransitioning = false;
        }, 2000);
        
        currentIndex = index;
    }
    
    function nextSlide() {
        if (isTransitioning) return;
        const nextIndex = (currentIndex + 1) % totalSlides;
        changeSlide(nextIndex);
    }
    
    function prevSlide() {
        if (isTransitioning) return;
        const prevIndex = (currentIndex - 1 + totalSlides) % totalSlides;
        changeSlide(prevIndex);
    }
    
    // Auto-slide with dynamic timing
    function startAutoSlide() {
        if (slideInterval) clearInterval(slideInterval);
        slideInterval = setInterval(nextSlide, 6000); // 6 seconds for more dramatic effect
    }
    
    function stopAutoSlide() {
        if (slideInterval) {
            clearInterval(slideInterval);
            slideInterval = null;
        }
    }
    
    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') {
            e.preventDefault();
            stopAutoSlide();
            nextSlide();
            setTimeout(startAutoSlide, 8000);
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            stopAutoSlide();
            prevSlide();
            setTimeout(startAutoSlide, 8000);
        }
    });
    
    // Preload images
    function preloadImages() {
        slides.forEach(slide => {
            const bgImage = slide.getAttribute('data-bg');
            if (bgImage) {
                const img = new Image();
                img.src = bgImage;
            }
        });
    }
    preloadImages();
    
    startAutoSlide();
    
    // Pause on interaction
    const slider = document.querySelector('.hero-slider');
    if (slider) {
        slider.addEventListener('mouseenter', stopAutoSlide);
        slider.addEventListener('mouseleave', startAutoSlide);
    }
    
    // Touch support
    let touchStartX = 0;
    if (slider) {
        slider.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            stopAutoSlide();
        }, { passive: true });
        
        slider.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextSlide();
                else prevSlide();
            }
            setTimeout(startAutoSlide, 8000);
        }, { passive: true });
    }
    
    console.log(`✨ Premium hero slider initialized with ${totalSlides} slides`);
    }

    // Initialize when DOM is ready
    document.addEventListener('DOMContentLoaded', initHeroSlider);

// ==========================================================================
// LAZY LOAD FOOTER LOGO
// ==========================================================================

function lazyLoadFooterLogo() {
    // Use Intersection Observer for lazy loading
    if ('IntersectionObserver' in window) {
        const logo = document.querySelector('.footer-logo.lazy');
        if (logo) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        const src = img.getAttribute('data-src');
                        if (src) {
                            // Add loading state
                            img.classList.add('loading');
                            
                            // Load the image
                            const tempImg = new Image();
                            tempImg.onload = function() {
                                img.src = src;
                                img.classList.remove('loading');
                                img.classList.add('loaded');
                            };
                            tempImg.onerror = function() {
                                // Keep placeholder on error
                                img.classList.remove('loading');
                                img.classList.add('error');
                            };
                            tempImg.src = src;
                        }
                        observer.unobserve(img);
                    }
                });
            }, {
                rootMargin: '50px 0px',
                threshold: 0.1
            });
            observer.observe(logo);
        }
    } else {
        // Fallback for older browsers - load immediately
        const logo = document.querySelector('.footer-logo.lazy');
        if (logo) {
            const src = logo.getAttribute('data-src');
            if (src) {
                logo.src = src;
            }
        }
    }
}
